apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: nignx
    image: niginx:alpine
    command: ["sh", "-c", "echo Hello Kubernetes! && sleep 3600"]
  - image: almalinux:8
    name: almalinux
    volumeMounts:
    - name: nignx-logs
      mountPath: /usr/share/nginx-logs
      readOnly: true
  volumes:
  - name: nignx-logs
    emptyDir:
    sizeLimit: 500Mi