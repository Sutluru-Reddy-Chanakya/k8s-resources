apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: nignx
    image: niginx:alpine
    volumeMounts:
    - name: nignx-logs
      mountPath: /usr/log/nginx
  - image: almalinux:8
    name: almalinux
    command: ["sleep", "2000"]
    volumeMounts:
    - name: nignx-logs
      mountPath: /usr/log/nginx-logs
      readOnly: true
  volumes:
  - name: nignx-logs
    emptyDir:
    sizeLimit: 10Mi