
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    volumeMounts:
    - name: nginx-logs
      mountPath: /usr/log/nginx

  - name: almalinux
    image: almalinux:8
    command: ["sleep", "2000"]
    volumeMounts:
    - name: nginx-logs
      mountPath: /usr/log/nginx-logs
      readOnly: true

  volumes:
  - name: nginx-logs
    emptyDir:
      sizeLimit: 10Mi
